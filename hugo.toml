baseURL = 'https://aarunishsinha.github.io/'
locale = 'en-us'
title = "Aarunish's Engineering Notes"
theme = 'PaperMod'

[taxonomies]
  series = 'series'
  tag = 'tags'

[params]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowToc = true
  ShowCodeCopyButtons = true
  ShowAllPagesInArchive = true
  mainSections = ["posts"]
  description = "Notes from pulling at threads — databases, systems, data structures, and whatever else won't let me sleep until I understand it."

  [params.homeInfoParams]
    Title = "Hey, I'm Aarunish 👋"
    Content = """
I'm a Software Engineer who can't stop asking *"but how does it actually work?"*

This blog is what happens when pop-science knowledge isn't enough and I need to actually understand something. I read from different sources, pull the threads together, and write notes that cut through the jargon without losing substance.

**If you're curious about how things really work, you'll feel at home here.**
"""

