[params]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowToc = true
  ShowCodeCopyButtons = true
  ShowAllPagesInArchive = true
  description = "Deep dives, scaling journeys, and engineering explorations — by someone who pulls at threads until they understand."

  [params.homeInfoParams]
    Title = "Hey, I'm Aarunish 👋"
    Content = """
I'm a Software Engineer who can't stop asking *"but how does it actually work?"*

This is where I write about the things I've dug into. From scaling systems from zero to a million users, to deep dives into the internals of tools, data structures and algorithms we use every day.

**I pull at threads until I understand.** If you like figuring out how things work from first principles, you'll feel at home here.
"""

